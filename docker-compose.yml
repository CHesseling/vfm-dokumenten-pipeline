services:
  db:
    # Voll qualifiziert: Podman bricht bei short-name-mode=enforcing ohne TTY sonst ab
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vfm
      POSTGRES_PASSWORD: vfm
      POSTGRES_DB: vfm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Nur bei Bedarf von aussen erreichbar machen:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # Muss zum user: unten passen (Besitzer von /data im Image)
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    # Fertiges Image aus der Registry per APP_IMAGE (scripts/start.sh setzt es);
    # Standard ist das lokal gebaute bzw. vom USB-Stick geladene Image.
    image: ${APP_IMAGE:-vfm-pipeline:latest}
    # Container-User ueber APP_UID/APP_GID in der .env anpassbar.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      # Port des Browser-Terminals auf dem Rechner (fuer den Link /terminal)
      TERMINAL_PORT: ${TERMINAL_PORT:-7681}
    # Init-Prozess raeumt beendete Terminal-Sitzungen (ttyd laeuft neben uvicorn)
    init: true
    extra_hosts:
      # Zugriff auf Ollama, das direkt auf dem Host laeuft
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8999}:8000"
      # Browser-Terminal (ttyd); TERMINAL=aus in der .env schaltet es ab
      - "${TERMINAL_BIND:-127.0.0.1}:${TERMINAL_PORT:-7681}:7681"
    volumes:
      - daten:/data
      # :z = SELinux-Label (Fedora/RHEL mit Docker oder Podman); sonst wirkungslos
      - ./material:/material:z
      # Frage und Kategorien der Klassifikation aenderbar, ohne das Image neu zu bauen
      - ./config:/app/config:ro,z

  # Optional: Ollama im Container statt auf dem Host
  # (docker compose --profile ollama up -d bzw. podman compose ...)
  ollama:
    image: docker.io/ollama/ollama:latest
    profiles: ["ollama"]
    environment:
      # Ollama-Standard ist ein kleines Kontextfenster; laengere Dokumente
      # wuerden sonst still abgeschnitten.
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_BIND:-127.0.0.1}:11434:11434"

volumes:
  postgres_data:
  daten:
  ollama:
