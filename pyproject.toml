[project]
name = "vfm-pipeline"
version = "0.1.0"
description = "Workshop-Pipeline für Dokumenten-Analyse mit LLMs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.1",
    "av<17",
    "sentence-transformers>=3.0",
    "typer>=0.19",
    "rich>=15.0.0",
    # direkt gelistet, damit [tool.uv.sources] (CPU-Wheels) greift
    "torch>=2.5",
    "torchvision>=0.20",
    "docling>=2.50",
    "easyocr>=1.7.2",
    "gliner2>=2.1.0",
    "pillow-heif>=1.8.1",
    "schwifty>=2026.11.0",
    "phonenumbers>=9.0.43",
    "dateparser>=1.5.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
vfm = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["modelle: braucht echte lokale Modelle"]
addopts = "-m 'not modelle'"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
# Standardregeln (Pyflakes + Kern von pycodestyle); `l` als Variablenname ist hier ok
ignore = ["E741"]
